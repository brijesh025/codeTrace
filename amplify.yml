version: 1

applications:
  - appRoot: frontend
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @codetrace/frontend build
      artifacts:
        baseDirectory: frontend/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - frontend/node_modules/**/*